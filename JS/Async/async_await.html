<!DOCTYPE html>
<html>
<body>
<h1>JavaScript async / await</h1>
<h2 id="demo"></h2>

<script>
async function myDisplay() {
  let myPromise = new Promise(function(resolve, reject) {
    setTimeout(()=>{
        resolve("I love You !!");
    },3000)
   
  });
  document.getElementById("demo").innerHTML = await myPromise; //wait for solving promise:work like synchronously
  document.getElementById('demo').innerHTML+=new Date(2018, 11, 24, 10, 33, 30, 0)
}

myDisplay();
</script>

</body>
</html>
